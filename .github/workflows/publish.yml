name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Only publish from main (release.yml dispatches with --ref main) or from a
    # published release, never from a dispatch on another branch.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; pin the major so a future npm
      # release cannot break publishing without a code change.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      # Same gates as CI.
      - run: npm run typecheck
      - run: npm run validate:artifacts
      - run: npm test

      - name: Check if this version is already published
        id: pub
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is already on npm; skipping publish (idempotent re-dispatch)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates via npm trusted publishing (OIDC, id-token: write above);
      # no NPM_TOKEN secret is used. Provenance is generated automatically.
      - name: Publish to npm
        if: steps.pub.outputs.skip == 'false'
        run: npm publish --access public
